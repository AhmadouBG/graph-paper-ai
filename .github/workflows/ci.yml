name: CI — Lint & Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint:
    name: 🔍 Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: 🧪 Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Tests that need API keys will be skipped via markers/env-guards
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY}}
      LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMACLOUD_API_KEY }}
      OLLAMA_HOST: "http://localhost:11434"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not integration"

# Triggered automatically when push to main or develop
# git push origin main

# Or when i open / update a Pull Request targeting main or develop
# → happens automatically in GitHub, no command needed
